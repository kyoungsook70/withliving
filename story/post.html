  <script>
  (function(){
    var main=document.getElementById('main');
    function el(tag,cls,text){var node=document.createElement(tag);if(cls)node.className=cls;if(text!=null)node.textContent=text;return node;}
    function fmtDate(value){var date=new Date(value+'T00:00:00');if(isNaN(date))return value||'';return date.getFullYear()+'. '+(date.getMonth()+1)+'. '+date.getDate()+'.';}
    function hrefOf(post){return post.url?String(post.url):'post.html?id='+encodeURIComponent(post.id||'');}
    function setAttr(selector,attr,value){var node=document.querySelector(selector);if(node)node.setAttribute(attr,value);}
    function addLd(data){var script=document.createElement('script');script.type='application/ld+json';script.textContent=JSON.stringify(data);document.head.appendChild(script);}
    function renderBody(source){
      var box=el('div','blog-body'); var blocks=String(source||'').replace(/\r\n/g,'\n').split(/\n\s*\n/);
      blocks.forEach(function(block){block=block.trim();if(!block)return;var lines=block.split('\n');
        if(lines.every(function(line){return /^- /.test(line.trim());})){var list=el('ul');lines.forEach(function(line){list.appendChild(el('li',null,line.trim().slice(2)));});box.appendChild(list);}
        else if(/^## /.test(block)){box.appendChild(el('h2',null,block.slice(3).trim()));}
        else{box.appendChild(el('p',null,block));}
      }); return box;
    }
    function notFound(){var box=el('div','post-not-found');box.appendChild(el('h1',null,'글을 찾을 수 없습니다'));box.appendChild(el('p',null,'주소가 잘못되었거나 삭제된 글일 수 있어요.'));var link=el('a',null,'이야기 목록으로 돌아가기');link.href='index.html';box.appendChild(link);main.appendChild(box);}
    function setMeta(post){
      var title=String(post.title||'이야기');var desc=String(post.description||post.summary||'').slice(0,160);var url=location.origin+location.pathname+'?id='+encodeURIComponent(post.id||'');var author=String(post.author||'').trim();
      document.title=title+' | NEXGEN';setAttr('meta[name="description"]','content',desc);setAttr('meta[name="author"]','content',author);setAttr('link[rel="canonical"]','href',url);setAttr('meta[property="og:title"]','content',title);setAttr('meta[property="og:description"]','content',desc);setAttr('meta[property="og:url"]','content',url);
      var article={'@context':'https://schema.org','@type':'BlogPosting',headline:title,description:desc,datePublished:String(post.date||''),dateModified:String(post.updated||post.date||''),mainEntityOfPage:url,keywords:Array.isArray(post.tags)?post.tags.map(String).join(', '):''};if(author)article.author={'@type':'Person',name:author};addLd(article);
      var faq=Array.isArray(post.faq)?post.faq.filter(function(item){return item&&item.q&&item.a;}):[];if(faq.length)addLd({'@context':'https://schema.org','@type':'FAQPage',mainEntity:faq.map(function(item){return{'@type':'Question',name:String(item.q),acceptedAnswer:{'@type':'Answer',text:String(item.a)}};})});
    }
    function renderFaq(items){var section=el('section','post-faq');section.appendChild(el('h2',null,'자주 묻는 질문'));items.forEach(function(item){var detail=el('details');detail.appendChild(el('summary',null,String(item.q)));detail.appendChild(el('p',null,String(item.a)));section.appendChild(detail);});return section;}
    function renderSources(items){var section=el('section','post-sources');section.appendChild(el('h2',null,'참고·출처'));var list=el('ol');items.forEach(function(item){var li=el('li');if(item&&item.url){var link=el('a',null,String(item.title||item.url));link.href=String(item.url);link.rel='noopener';link.target='_blank';li.appendChild(link);}else li.textContent=String(item&&item.title||item||'');list.appendChild(li);});section.appendChild(list);return section;}
    function render(posts){
      var id=new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('slug');posts=(Array.isArray(posts)?posts:[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});var index=-1;
      posts.forEach(function(post,i){if(String(post.id)===id||(post.url&&String(post.url).replace(/\.html$/,'')===id))index=i;});if(index<0){notFound();return;}var post=posts[index];setMeta(post);
      var article=el('article','post-article');var head=el('header','post-head');var time=el('time',null,fmtDate(post.date));time.setAttribute('datetime',String(post.date||''));head.appendChild(time);head.appendChild(el('h1',null,String(post.title||'(제목 없음)')));
      if(post.author||(post.updated&&post.updated!==post.date)){var meta=el('p','post-meta');if(post.author)meta.appendChild(el('span',null,String(post.author)));if(post.updated&&post.updated!==post.date)meta.appendChild(el('span',null,'수정 '+fmtDate(post.updated)));head.appendChild(meta);}
      if(Array.isArray(post.tags)&&post.tags.length){var tags=el('div','post-tags');post.tags.forEach(function(tag){tags.appendChild(el('span','post-tag',String(tag)));});head.appendChild(tags);}article.appendChild(head);article.appendChild(el('hr','post-rule'));article.appendChild(renderBody(post.body));
      var faq=Array.isArray(post.faq)?post.faq.filter(function(item){return item&&item.q&&item.a;}):[];if(faq.length)article.appendChild(renderFaq(faq));if(Array.isArray(post.sources)&&post.sources.length)article.appendChild(renderSources(post.sources));
      var older=posts[index+1],newer=posts[index-1];if(older||newer){var nav=el('nav','post-pagination');function cell(item,cls,label){if(!item){nav.appendChild(el('span'));return;}var link=el('a',cls);link.href=hrefOf(item);link.appendChild(el('span','post-direction',label));link.appendChild(el('strong',null,String(item.title||'')));nav.appendChild(link);}cell(older,'previous','이전 글');cell(newer,'next','다음 글');article.appendChild(nav);}main.appendChild(article);
    }
    fetch('posts.json',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error(response.status);return response.json();}).then(render).catch(notFound);
  })();
  </script>
