name: Daily WITH LIVING blog

on:
  schedule:
    # 12:30 UTC = 21:30 Asia/Seoul (GitHub may delay scheduled runs)
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-withliving-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Fix publication date for this run
        run: echo "PUBLISH_DATE=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_ENV"
      - name: Generate and validate today's post
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
        run: |
          python scripts/generate_daily_post.py --date "$PUBLISH_DATE"
          python -m json.tool story/posts.json >/dev/null
          python -m json.tool daily-review.json >/dev/null
          python -c "from xml.etree import ElementTree as ET; ET.parse('sitemap.xml'); ET.parse('feed.xml')"
          python scripts/audit_site.py --strict
          git restore reports/seo-audit.md
          git diff --check
          if git diff --quiet -- story/posts.json; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit validated post and create pull request
        if: steps.generate.outputs.created == 'true'
        id: pr
        run: |
          branch="codex/daily-withliving-story-${PUBLISH_DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "kyoungsook70"
          git config user.email "kyoungsook70@users.noreply.github.com"
          git add story sitemap.xml feed.xml llms.txt daily-review.json
          git commit -m "Publish daily WITH LIVING story ${PUBLISH_DATE}"
          git push --set-upstream origin HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('daily-review.json').read_text())
          Path('/tmp/daily-pr-body.md').write_text(
              f"검증 통과 후 자동 병합·배포하는 글입니다.\n\n제목: {review['title']}\n\n"
              f"공개 URL: {review['url']}\n\n{review['article_markdown']}\n")
          PY
          pr_url=$(gh pr create --base main --head "$branch" --title "오늘의 위드리빙 블로그: ${PUBLISH_DATE}" --body-file /tmp/daily-pr-body.md)
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
      - name: Merge only the validated revision
        if: steps.generate.outputs.created == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git fetch origin main
          # If main moved, retain the PR for reconciliation instead of merging stale lists.
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$(git rev-parse HEAD)" -f merge_method=merge > /tmp/merge-result.json
          python -c "import json; assert json.load(open('/tmp/merge-result.json'))['merged']"
      - name: Verify article and index on production
        run: python scripts/verify_publication.py --date "$PUBLISH_DATE"
      - name: Record failure
        if: failure()
        run: |
          echo '## 자동발행 실패' >> "$GITHUB_STEP_SUMMARY"
          echo '실패 단계와 재시도 로그를 확인하세요. 생성·검증 실패 글은 병합되지 않으며, 병합 후 공개 확인 실패는 배포 문제일 수 있습니다.' >> "$GITHUB_STEP_SUMMARY"
