name: Daily WITH LIVING blog

on:
  schedule:
    # 23:00 UTC = 08:00 Asia/Seoul (다음 날)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-withliving-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create today's review branch
        run: git switch -c "codex/daily-withliving-story-$(TZ=Asia/Seoul date +%F)-${{ github.run_id }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
        run: python scripts/generate_daily_post.py

      - name: Validate generated files
        run: |
          python -m json.tool story/posts.json >/dev/null
          python -m json.tool daily-review.json >/dev/null
          python -c "from xml.etree import ElementTree as ET; ET.parse('sitemap.xml'); ET.parse('feed.xml')"
          python scripts/audit_site.py
          git restore reports/seo-audit.md
          test -z "$(git diff --check)"

      - name: Commit review branch
        run: |
          git config user.name "kyoungsook70"
          git config user.email "kyoungsook70@users.noreply.github.com"
          git add story sitemap.xml feed.xml llms.txt daily-review.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish daily WITH LIVING story $(TZ=Asia/Seoul date +%F)"
          git push --set-upstream origin HEAD

      - name: Open human-review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path("daily-review.json").read_text(encoding="utf-8"))
          checks = "\n".join(f"- [ ] {item}" for item in review["fact_check"])
          body = f"""## 오늘 쓴 글

          - 제목: {review['title']}
          - 공개 예정 URL: {review['url']}
          - 남은 글감: {review['remaining_ideas']}개
          - 새로 보충한 글감: {review['added_ideas']}개

          ## 사람이 사실 확인할 문장

          {checks}

          확인 후 이 PR을 Merge하면 Vercel이 자동 배포합니다.

          ## Merge 후 1분 확인

          - [ ] ChatGPT 또는 Perplexity에서 공개 URL의 제목·FAQ 요약 확인
          - [ ] Google Rich Results에서 FAQ·Breadcrumb 감지 확인
          - [ ] Google Search Console에서 새 글 색인 생성 요청
          """
          Path("daily-pr-body.md").write_text(body, encoding="utf-8")
          PY
          gh pr create \
            --base main \
            --head "$(git branch --show-current)" \
            --title "오늘의 위드리빙 블로그: $(TZ=Asia/Seoul date +%F)" \
            --body-file daily-pr-body.md
